# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: emerald

# Site icon (favicon)
icon:
  pack: 'custom'
  icon: 'icon'

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'University of California, Santa Cruz'
    description: 'Apostolos Mavrogiannakis - PhD Student in Computer Science at UC Santa Cruz. Research in cryptography, privacy-preserving systems, and secure computation.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: "Apostolos Mavrogiannakis"

# Site footer
footer:
  copyright:
    notice: '© {year} Apostolos Mavrogiannakis'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false
  block: minimal

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
